name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: gem build rule_lens.gemspec
      - run: ruby script/package_smoke.rb rule_lens-0.2.0.gem
  playground:
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE_PATH: ${{ github.workspace }}/examples/playground/vendor/bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: examples/playground
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: examples/playground
      - run: bundle install
        working-directory: examples/policy_review
        env:
          BUNDLE_FROZEN: "true"
      - run: ruby ../../script/test_core.rb
      - run: ruby bin/rails test
      - run: ruby bin/rails zeitwerk:check
